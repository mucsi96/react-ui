<!doctype html>
<!-- Frozen native-button output of Cooking ee5828c:
     client/src/app/header/header.component.html and .css.
     The original component has no Material styling on the button itself. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        --bt-surface-1: hsl(215, 28%, 17%);
        --bt-outline: hsl(215, 14%, 34%);
        --bt-text-on-brand: white;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .avatar {
        display: inline-flex;
        user-select: none;
        background-color: var(--bt-outline);
        border-radius: 50%;
        height: 40px;
        justify-content: center;
        align-items: center;
        aspect-ratio: 1;
        color: var(--bt-text-on-brand);
        font-size: 18px;
        border: unset;
      }
    </style>
  </head>
  <body>
    <button class="avatar" aria-label="Felhasználói menü">IB</button>
  </body>
</html>
